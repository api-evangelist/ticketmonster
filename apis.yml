aid: ticketmonster
name: Ticketmonster
description: >-
  Ticketmonster (TMON) is a South Korean e-commerce and social-commerce platform
  founded in 2010 as "Ticket Monster." Operating primarily at tmon.co.kr (the legacy
  ticketmonster.co.kr brand), TMON sells deals, daily bargains, fashion, travel, and
  a broad retail catalog to Korean consumers via web and mobile apps. It grew into one
  of Korea's leading online marketplaces and was later brought under the Qoo10 group.
  TMON is a consumer-facing retail/marketplace business; it does not publish a public
  developer program, API portal, OpenAPI specification, SDKs, or documented API surface.
  This profile was surfaced as a portfolio-linked company and enriched by the API
  Evangelist pipeline, which confirmed the absence of any public API surface.
